# Shared job setup: pnpm at the version pinned in package.json ("packageManager": "pnpm@x.y.z"), Node from
# .nvmrc with the pnpm store cached per lockfile, then a frozen install. Run actions/checkout first.
name: Set up Node and pnpm
description: Installs pnpm and Node, restores the pnpm store cache and installs the workspace dependencies.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

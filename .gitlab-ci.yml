# GitLab CI for project-management. Runs on merge requests, on the default branch and on release tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - install
  - check
  - test
  - build
  - release
  - deploy

# Node jobs share a pnpm store cached per lockfile. The install job fills it; the others only read it and
# install offline-first, which takes seconds once the store is warm.
.node:
  image: node:24-slim
  variables:
    PNPM_STORE: $CI_PROJECT_DIR/.pnpm-store
  cache:
    key:
      prefix: pnpm-store
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull
  before_script:
    # Install the pnpm version pinned in package.json ("packageManager": "pnpm@x.y.z").
    - npm install --global --no-fund --no-audit --allow-scripts=pnpm pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')
    - pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE"

install:
  extends: .node
  stage: install
  cache:
    policy: pull-push
  script:
    - pnpm store prune --store-dir "$PNPM_STORE"

lint:
  extends: .node
  stage: check
  needs: [install]
  script:
    # Biome follows .gitignore, which already lists the CI pnpm store (.pnpm-store/).
    - pnpm lint

typecheck:
  extends: .node
  stage: check
  needs: [install]
  script:
    - pnpm typecheck

test:
  extends: .node
  stage: test
  needs: [install]
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: project_management
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/project_management
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-tests-0123456789
    BETTER_AUTH_URL: http://localhost:3000
    PUBLIC_URL: http://localhost:3000
  script:
    - pnpm test

# Builds the image, starts the self-hosting stack with docker compose and waits for /api/healthz.
docker-build:
  stage: build
  needs: []
  image: docker:29-cli
  services:
    # TLS off and the "docker" alias: the setup that works on the Kubernetes runner (as in other Reddevs projects).
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-ci-0123456789abcdef
    PM_IMAGE: project-management:$CI_COMMIT_SHORT_SHA
  before_script:
    # Fail within a minute instead of hanging when the daemon is unreachable.
    - |
      for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
      docker info >/dev/null
  script:
    - docker compose build
    - docker compose up -d
    # Ports published by the stack live on the dind service, reachable as "docker".
    - |
      for attempt in $(seq 1 60); do
        if wget -qO- http://docker:3000/api/healthz; then echo; echo "healthy after ${attempt} attempts"; exit 0; fi
        sleep 2
      done
      echo "web did not become healthy"
      docker compose ps -a
      docker compose logs
      exit 1
  after_script:
    - docker compose down -v --remove-orphans

# End-to-end tests: Playwright against the docker compose stack on the dind service (see e2e/stack.ts).
# Runs after docker-build in the same stage, so a broken image fails fast and cheap. The Playwright image has
# Node 24 and the browsers matching @playwright/test; it gets the Docker CLI from Ubuntu's packages.
e2e:
  extends: .node
  stage: build
  needs: [install, docker-build]
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  services:
    # TLS off and the "docker" alias: the setup that works on the Kubernetes runner (as in other Reddevs projects).
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Ports published by the stack live on the dind service, reachable as "docker".
    E2E_BASE_URL: http://docker:3100
    # The upgrade test starts from the published M1 image (pulled with the job token).
    E2E_M1_IMAGE: $CI_REGISTRY_IMAGE:0.1.1
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends docker.io docker-compose-v2 docker-buildx >/dev/null
    - |
      for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
      docker info >/dev/null
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - !reference [.node, before_script]
  script:
    - pnpm e2e
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml

# Releases: an X.Y.Z tag (no pre-release suffix) builds the image, pushes it to this project's registry and
# bumps the image tag for pm.example.com in gitops (apps/project-management/cluster-production.yaml);
# ArgoCD (ApplicationSet apps-cluster-production) rolls it out. Same flow as conference-search.
.production:
  environment:
    name: production
    url: https://pm.example.com
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'

release-image:
  extends: .production
  stage: release
  needs: [lint, typecheck, test, e2e]
  image: docker:29-cli
  services:
    # Plain-TCP dind with the "docker" alias, as for docker-build (Kubernetes runner).
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - |
      for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
      docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --tag "$CI_REGISTRY_IMAGE:latest" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE"

# GITOPS_TOKEN (masked) is a reddevsdotio group variable: a gitops token allowed to push
# to main. The worker and the migrate initJob inherit .image, so one tag covers all three roles.
deploy-production:
  extends: .production
  stage: deploy
  needs: [release-image]
  image: alpine/k8s:1.35.0 # ships git and yq
  variables:
    GIT_STRATEGY: none # only touches the gitops repo
    GITOPS_REPO: gitlab.com/example/gitops.git
    VALUES_FILE: apps/project-management/cluster-production.yaml
  script:
    - export IMAGE_TAG="$CI_COMMIT_TAG"
    - git config --global user.name "project-management-ci"
    - git config --global user.email "ci@reddevs.io"
    - git clone "https://oauth2:${GITOPS_TOKEN}@${GITOPS_REPO}" gitops
    - cd gitops
    - yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
    - |
      if git diff --quiet; then
        echo "image tag ${IMAGE_TAG} already deployed, nothing to do"
        exit 0
      fi
    - 'git commit -am "project-management: ${IMAGE_TAG}"'
    - |
      # Push to main, rebasing over concurrent deploy commits.
      for i in 1 2 3; do
        git push origin HEAD:main && exit 0
        git pull --rebase origin main || exit 1
      done
      echo "could not push after 3 attempts"
      exit 1
